[package]
name = "sloth-note"
version = "0.1.0"
description = "Offline Markdown editor with notes in files the user controls"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
